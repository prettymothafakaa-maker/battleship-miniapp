<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Морской Бой</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <div class="status-bar">
                <div class="player-info">
                    <div class="avatar-placeholder"></div>
                    <span class="player-name">Вы</span>
                </div>
                <div class="game-stats">
                    <div class="stat">
                        <span class="stat-label">Попадания</span>
                        <span class="stat-value" id="hits">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Промахи</span>
                        <span class="stat-value" id="misses">0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Game Phase Indicator -->
        <div class="phase-indicator" id="phaseIndicator">
            <div class="phase-badge">Расстановка кораблей</div>
            <div class="phase-hint" id="phaseHint">Расставьте корабли на своём поле</div>
        </div>

        <!-- Ship Selection (Setup Phase) -->
        <div class="ship-selector" id="shipSelector">
            <div class="ship-list">
                <div class="ship-item" data-size="4" data-count="1">
                    <div class="ship-visual ship-4"></div>
                    <span class="ship-label">Линкор (4)</span>
                    <span class="ship-count">×1</span>
                </div>
                <div class="ship-item" data-size="3" data-count="2">
                    <div class="ship-visual ship-3"></div>
                    <span class="ship-label">Крейсер (3)</span>
                    <span class="ship-count">×2</span>
                </div>
                <div class="ship-item" data-size="2" data-count="3">
                    <div class="ship-visual ship-2"></div>
                    <span class="ship-label">Эсминец (2)</span>
                    <span class="ship-count">×3</span>
                </div>
                <div class="ship-item" data-size="1" data-count="4">
                    <div class="ship-visual ship-1"></div>
                    <span class="ship-label">Катер (1)</span>
                    <span class="ship-count">×4</span>
                </div>
            </div>
            <button class="btn-rotate" id="rotateBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
                </svg>
                Повернуть
            </button>
        </div>

        <!-- Game Boards -->
        <div class="boards-container">
            <!-- Player Board -->
            <div class="board-wrapper">
                <h3 class="board-title">Ваше поле</h3>
                <div class="game-board" id="playerBoard"></div>
            </div>

            <!-- Enemy Board -->
            <div class="board-wrapper" id="enemyBoardWrapper" style="display: none;">
                <h3 class="board-title">Поле противника</h3>
                <div class="game-board enemy-board" id="enemyBoard"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-panel">
            <button class="btn-primary" id="startBtn" disabled>
                <span class="btn-icon">⚓</span>
                Начать игру
            </button>
            <button class="btn-secondary" id="randomBtn">
                <span class="btn-icon">🎲</span>
                Случайная расстановка
            </button>
            <button class="btn-secondary" id="resetBtn" style="display: none;">
                <span class="btn-icon">🔄</span>
                Новая игра
            </button>
        </div>

        <!-- Game Over Modal -->
        <div class="modal" id="gameOverModal">
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon">🎉</div>
                <h2 class="modal-title" id="modalTitle">Победа!</h2>
                <p class="modal-text" id="modalText">Вы потопили все корабли противника</p>
                <div class="modal-stats" id="modalStats"></div>
                <button class="btn-primary" id="newGameBtn">Играть ещё раз</button>
            </div>
        </div>
    </div>

    <!-- Waiting Message -->
    <div class="waiting-message" id="waitingMessage" style="display: none;">
        <div class="waiting-content">
            <div class="spinner"></div>
            <p>Ожидание противника...</p>
            <p class="waiting-hint">Противник расставляет корабли</p>
        </div>
    </div>

    <script src="multiplayer_game.js"></script>
</body>
</html>
